    <circle cx="15" cy="22" r="12" stroke="#000" stroke-width="7.4"/>
  </mask>
  <circle cx="29" cy="22" r="12" stroke="#c4b5fd" stroke-width="3.8" mask="url(#behind)"/>
  <circle cx="15" cy="22" r="12" stroke="#7c3aed" stroke-width="3.8"/>
</svg>
